[build]
  command = "node build.js && node scripts/check.js"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Long cache for static assets, short for HTML so new posts appear fast
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Generated prompt art keeps its file name when a prompt changes, so cache it for a day only
[[headers]]
  for = "/samples/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# The tool script is loaded as /tool-engine.js?v=<hash>, so each version can be cached forever
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Force trailing-slash URLs so each page has exactly one canonical address
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

# Branch / pull-request deploy previews use the same build + check,
# so every change can be reviewed on a preview URL before it reaches main.
[context.deploy-preview]
  command = "node build.js && node scripts/check.js"

[context.branch-deploy]
  command = "node build.js && node scripts/check.js"
